<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="Tahoma, 'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3f7fd"/>
      <stop offset="1" stop-color="#dbe5f5"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1f5c"/>
      <stop offset="1" stop-color="#06143d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1080" cy="80" r="170" fill="#3eead0" opacity="0.18"/>
  <circle cx="90" cy="570" r="140" fill="#0b63e5" opacity="0.10"/>

  <!-- العنوان (يمين) -->
  <text x="1110" y="220" text-anchor="end" font-size="60" font-weight="700" fill="#0a1f5c">دعوة الأشخاص</text>
  <text x="1110" y="300" text-anchor="end" font-size="60" font-weight="700" fill="#0a1f5c">إلى محفظة الأعمال</text>
  <rect x="1010" y="330" width="100" height="8" rx="4" fill="#3eead0"/>
  <text x="1110" y="400" text-anchor="end" font-size="30" fill="#475569">دليل خطوة بخطوة مع الصور</text>

  <!-- نافذة الدعوة (يسار) -->
  <g transform="translate(70,100)">
    <rect width="520" height="430" rx="24" fill="#ffffff" stroke="#dbe5f5" stroke-width="2"/>
    <rect x="0" y="0" width="520" height="70" rx="24" fill="url(#dark)"/>
    <rect x="0" y="40" width="520" height="30" fill="url(#dark)"/>
    <text x="490" y="46" text-anchor="end" font-size="26" font-weight="700" fill="#ffffff">دعوة الأشخاص</text>

    <!-- المراحل -->
    <g font-size="22" fill="#0a1f5c">
      <circle cx="478" cy="125" r="13" fill="#3eead0"/>
      <text x="450" y="133" text-anchor="end">إدخال البريد الإلكتروني</text>
      <circle cx="478" cy="175" r="13" fill="#3eead0"/>
      <text x="450" y="183" text-anchor="end">منح الصلاحية</text>
      <circle cx="478" cy="225" r="13" fill="#3eead0"/>
      <text x="450" y="233" text-anchor="end">تعيين الأصول</text>
      <circle cx="478" cy="275" r="13" fill="none" stroke="#0b63e5" stroke-width="4"/>
      <text x="450" y="283" text-anchor="end" fill="#0b63e5" font-weight="700">المراجعة</text>
    </g>

    <rect x="40" y="320" width="440" height="1.5" fill="#dbe5f5"/>
    <rect x="40" y="350" width="150" height="52" rx="10" fill="#0b63e5"/>
    <text x="115" y="384" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">إرسال</text>
    <rect x="205" y="350" width="100" height="52" rx="10" fill="#ffffff" stroke="#dbe5f5" stroke-width="2"/>
    <text x="255" y="384" text-anchor="middle" font-size="22" fill="#0a1f5c">عودة</text>
  </g>
</svg>
